
<div class="container">
  <label>Brand</label>
  <input
    id="brand"
    type="text"
    #brandInput
    (input)="selectAutos(brandInput.value)"
    placeholder="Enter a brand..."
  />
  <fa-icon [icon]="faMagnifyingGlass"></fa-icon>
</div>

@if (selectedCar) {
  <div class="car-details">
    <h2>{{ selectedCar.brand }} {{ selectedCar.model }}</h2>
    <p>{{ selectedCar.description }}</p>

    <button (click)="selectedCar = null">Back</button>
  </div>
} @else {
  <div class="auto-list">
    @for (auto of selectedAutos; track auto.id) {
      <div class="auto-card">
        <img [src]="'/images/' + auto.photo" [alt]="auto.brand">

        <div class="details">
          <h3>{{ auto.brand }} {{ auto.model }}</h3>

          <p>
            Power: {{ auto.power }}<br>
            Price: {{ auto.price }}<br>
            Only {{ auto.availability }} units in stock
          </p>
        </div>

        <button (click)="selectCar(auto)">See more</button>
      </div>
    }
  </div>
}
